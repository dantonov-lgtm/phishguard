<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhishGuard</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>PhishGuard</h1>
      <p class="notice">Scans page text for common warning signs. A low-risk result does not prove a message is safe.</p>
      <button id="scan">Scan open message</button>
      <section id="result" aria-live="polite" hidden></section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
